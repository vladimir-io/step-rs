[package]
name = "steprs-cli"
description = "CLI for STEP inspection and analysis"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "steprs"
path = "src/main.rs"

[dependencies]
steprs = { path = "../steprs" }
steprs-core = { path = "../steprs-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json.workspace = true
